{% extends 'todos/base.html' %} {% block title %} Templating {% endblock%}
{%block content %}
<h1>Data</h1>

<ul>
  {% for todo in todos %}
  <li>{{ todo.id }} - {{ todo.title }} - {{ todo.done }}</li>
  <br />
  <small>owned by: {{ todo.owner.name }}</small>
  {% endfor%}
</ul>

<form method="post" action="{% url 'todos_view' %}">
  {% csrf_token %} {{ form.as_p}}
  <button type="submit">Submit</button>
</form>

{% endblock%}
